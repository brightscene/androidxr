name: Fetch photos
on:
  push:
    branches: [main]
    paths: [tools/photo-queries.json, tools/fetch-photos.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fetch-photos.mjs
      - run: |
          git config user.name "MindLyte"
          git config user.email "brightscene@users.noreply.github.com"
          git checkout -B photo-candidates
          git add -f cand
          git commit -m "Photo candidates from Wikimedia Commons" || echo "nothing to commit"
          git push -f origin photo-candidates
